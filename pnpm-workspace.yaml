packages:
  - 'packages/*'
  # The example app. In the workspace so it consumes the packages by link — it
  # is the only thing in the repo that exercises them the way a consumer does.
  # Excluded from `pnpm build`; see the root package.json.
  - 'apps/*'

allowBuilds:
  esbuild: true

# esbuild arrives transitively (tsdown → rolldown toolchain) and needs its
# postinstall to fetch the platform binary.
onlyBuiltDependencies:
  - esbuild
