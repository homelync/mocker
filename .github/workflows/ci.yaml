name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Each check is its own job so they run side by side. None of them needs
# another's output: every package's development `exports` map points at `src`,
# so typecheck, test and e2e resolve the workspace packages without a build.
jobs:
  spellcheck:
    name: Spellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm spell-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build

  # The first CI job that starts an app. `pnpm build` filters to
  # `./packages/*`, so `apps/*` is otherwise only typechecked — and the e2e
  # app has no build step at all: it is one HTML file and a node server.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install browsers
        run: pnpm --filter @homelync/e2e-example exec playwright install --with-deps chromium
      - run: pnpm e2e

  # One stable check name to mark as required in branch rules, so adding or
  # renaming a job above never needs a settings change. `always()` makes it
  # report a failure rather than "skipped" when a job it needs fails.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [spellcheck, lint, typecheck, test, build, e2e]
    if: always()
    steps:
      - name: Check every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A CI job did not succeed: $RESULTS"
              exit 1
            fi
          done
