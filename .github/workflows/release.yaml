name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24.19.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - uses: changesets/action@v2.1.0
        with:
          # `version-packages`, not a bare `changeset version`: changeset version
          # writes package.json only, so the lockfile would keep reporting the
          # previous version forever. The script re-syncs it.
          version: npm run version-packages
          publish: npx changeset publish
          commit: "chore: version packages"
          title: "changeset: cut release"
        env:
          GITHUB_TOKEN: ${{ secrets.HOMELINK_BOT_PACKAGES_PAT }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
